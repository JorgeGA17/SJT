<div class="overlay-container">
  <div class="overlay-header">
    <div>
      <h2 mat-dialog-title>Casaciones del {{ formattedDate | titlecase }}</h2>
      <p class="subtitle">{{ votaciones.length }} votación(es) programada(s)</p>
    </div>
    <button mat-icon-button (click)="close()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <mat-dialog-content>
    <div class="table-container">
      <table mat-table [dataSource]="votaciones" class="votaciones-table">
        <!-- Columna Expediente -->
        <ng-container matColumnDef="numeroRecurso">
          <th mat-header-cell *matHeaderCellDef>Expediente</th>
          <td mat-cell *matCellDef="let votacion">
            <strong>{{ votacion.numeroRecurso }}</strong>
          </td>
        </ng-container>

        <!-- Columna Fecha -->
        <ng-container matColumnDef="fechaProgramacion">
          <th mat-header-cell *matHeaderCellDef>Fecha Programacion</th>
          <td mat-cell *matCellDef="let votacion">
            {{ votacion.fechaProgramacion | date: 'short' }}
          </td>
        </ng-container>

        <!-- Columna Ponente -->
        <ng-container matColumnDef="vocalPonente">
          <th mat-header-cell *matHeaderCellDef>Ponente</th>
          <td mat-cell *matCellDef="let votacion">{{ votacion.vocalPonente }}</td>
        </ng-container>

        <!-- Columna estado -->
        <ng-container matColumnDef="nombreEstado">
          <th mat-header-cell *matHeaderCellDef>Estado de Voto</th>
          <td mat-cell *matCellDef="let votacion">{{ votacion.nombreEstado }}</td>
        </ng-container>

        <!-- Columna Acción -->
        <ng-container matColumnDef="accion">
          <th mat-header-cell *matHeaderCellDef>Acción</th>
          <td mat-cell *matCellDef="let votacion">
            <button mat-mini-fab 
            aria-label="Example icon button with a vertical three dot icon" (click)="selectVotacion(votacion)">
                <mat-icon>open_in_new</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr
          mat-row
          *matRowDef="let row; columns: displayedColumns"
          class="votacion-row"
        ></tr>
      </table>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button (click)="close()">Cerrar</button>
  </mat-dialog-actions>
</div>
