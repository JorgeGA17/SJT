spring:
 ## config:
   ## import: "classpath:votacion-judicial-suprema.yml"
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        "[transaction.coordinator_class]": jta
        "[jta.platform]": org.hibernate.service.jta.platform.internal.JBossAppServerJtaPlatform
    open-in-view: false
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    url: /v3/api-docs
  paths-to-match: /**


logging:
  level:
    "[org.springframework.web]": ERROR
    "[org.springdoc]": ERROR
    "[org.springframework.security]": ERROR
    "[org.springframework.data]": ERROR
    "[org.hibernate.SQL]": DEBUG
    "[org.hibernate.type.descriptor.sql]": TRACE
    "[org.springframework.transaction.interceptor]": TRACE
    org.hibernate.orm.mapping: TRACE
    org.hibernate.metamodel: DEBUG


##agregado ugdj
# Agrega esto al final de tu application.yml
timeout:
  client:
    api:
      conection: 10000
      read: 10000
  database:
    transaction: 120

seguridad:
  # Campo 'String key' (Obligatorio para firmar tokens)
  key: "esta-es-una-clave-secreta-super-segura-para-desarrollo-123456"

  # Record 'Dominios'
  dominios:
    permitidos: "*"  # Permite todos los orígenes (CORS)

  # Record 'Aplicativo'
  aplicativo:
    identificador: 1
    nombre: "Votacion Judicial Suprema"

  # Record 'Authenticate' -> 'Token'
  authenticate:
    token:
      expira: 3600   # Tiempo en segundos (1 hora)
      refresh: 7200  # Tiempo en segundos (2 horas)

  # Record 'Auditoria'
  auditoria:
    requerida: "S"
